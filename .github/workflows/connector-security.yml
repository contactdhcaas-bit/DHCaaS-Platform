name: Connector security gate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        shell: bash
        working-directory: backend

    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: ${{ vars.DHC_CI_PYTHON_VERSION || '3.11' }}

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -c "import pytest, psycopg2"

      - name: Configure isolated test environment
        env:
          MASTER_KEY_ENCODING: ${{ vars.DHC_MASTER_KEY_ENCODING }}
          MONGO_URI_ENV_NAME: ${{ vars.DHC_MONGO_URI_ENV_NAME }}
          MONGO_DB_ENV_NAME: ${{ vars.DHC_MONGO_DB_ENV_NAME }}
          JWT_SECRET_ENV_NAME: ${{ vars.DHC_JWT_SECRET_ENV_NAME }}
          CI_ENV_JSON: ${{ vars.DHC_CI_ENV_JSON }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import secrets

          encoding = os.environ["MASTER_KEY_ENCODING"]
          if encoding not in {"base64", "hex"}:
              raise SystemExit(
                  "Set DHC_MASTER_KEY_ENCODING to the exact SecretStore "
                  "format: base64 or hex"
              )

          names = [
              os.environ["MONGO_URI_ENV_NAME"],
              os.environ["MONGO_DB_ENV_NAME"],
              os.environ["JWT_SECRET_ENV_NAME"],
          ]
          if (
              len(set(names)) != 3
              or any(not re.fullmatch(r"[A-Z][A-Z0-9_]*", n) for n in names)
          ):
              raise SystemExit("Configure distinct actual settings env names")

          protected = {
              "DHC_MASTER_KEY", "DHC_CANARY_DB", "ALLOW_PRIVATE_CONNECTORS",
              "CONNECTOR_TEST_ENABLED", *names,
          }
          if any(n in protected - set(names) for n in names):
              raise SystemExit("Settings env names conflict with gate controls")

          extra = json.loads(os.environ.get("CI_ENV_JSON") or "{}")
          if not isinstance(extra, dict):
              raise SystemExit("DHC_CI_ENV_JSON must be a JSON object")

          for name, value in extra.items():
              if (
                  not re.fullmatch(r"[A-Z][A-Z0-9_]*", name)
                  or name in protected
                  or name.startswith(("GITHUB_", "RUNNER_", "PYTHON", "LD_"))
                  or name in {"PATH", "BASH_ENV", "ENV"}
                  or not isinstance(value, str)
                  or any(c in value for c in "\r\n")
              ):
                  raise SystemExit("Invalid additional CI configuration")

          raw = secrets.token_bytes(32)
          master = (
              base64.b64encode(raw).decode("ascii")
              if encoding == "base64"
              else raw.hex()
          )
          jwt = secrets.token_hex(48)

          values = {
              **extra,
              names[0]: "mongodb://127.0.0.1:27017",
              names[1]: "dhcaas_canary_test_db",
              names[2]: jwt,
              "DHC_MASTER_KEY": master,
              "DHC_CANARY_DB": "dhcaas_canary_test_db",
              "ALLOW_PRIVATE_CONNECTORS": "false",
              "CONNECTOR_TEST_ENABLED": "false",
          }

          print(f"::add-mask::{master}")
          print(f"::add-mask::{jwt}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as stream:
              for name, value in values.items():
                  stream.write(f"{name}={value}\n")
          PY

      - name: Run hardening and transport suites
        run: |
          mkdir -p .pytest-evidence
          test ! -e .dev_master_key
          git rev-parse HEAD > .pytest-evidence/commit.txt
          python -m pytest \
            tests/test_ssrf_guard.py \
            tests/test_task3_asgi_suite.py \
            tests/test_task4_jwt_hardening.py \
            tests/test_transport_pinning.py \
            -v --junitxml=.pytest-evidence/security.xml
          test ! -e .dev_master_key
          git diff --exit-code

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connector-security-${{ github.sha }}
          path: backend/.pytest-evidence/
          retention-days: 14
          if-no-files-found: error